[pytest]
# Keep file-level distribution because several test modules share server/browser fixtures.
# The limits bound hangs; they do not delay passing tests. Worker restarts are disabled because
# an unclean worker exit can leave the controller stalled without useful test output.
addopts = -n 16 --dist loadfile --timeout=180 --timeout-method=thread --session-timeout=600
          --max-worker-restart=0

# Retain failed tmp_path directories for diagnosis while dropping successful-run fixtures.
tmp_path_retention_count = 2
tmp_path_retention_policy = failed

# Whole-tree invariant checks registered in conftest.py's GATE_FILES.
markers =
    gates: whole-tree invariants (suppression ratchets, byte scan, line endings, extension stamp)

filterwarnings =
    ignore::FutureWarning:diffusers
    ignore::FutureWarning:torch
    ignore:.*sdp_kernel.*:FutureWarning
